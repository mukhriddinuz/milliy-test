<style>
  .nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: rgb(26 35 40 / .96); backdrop-filter: blur(8px);
         border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
  .nav-inner { max-width: 36rem; margin: 0 auto; height: 72px; display: flex; align-items: center; justify-content: space-around; padding: 0 6px; }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: var(--r);
              color: var(--muted); font-size: 11px; font-weight: 600; transition: color .15s, background .15s; }
  .nav-item svg { width: 22px; height: 22px; }
  .nav-item.active { color: var(--primary); background: rgb(74 144 226 / .12); }
  .nav-avatar { width: 22px; height: 22px; border-radius: 999px; object-fit: cover; }
  .nav-item.active .nav-avatar { box-shadow: 0 0 0 2px var(--primary); }
</style>
<nav class="nav">
  <div class="nav-inner">
    <a href="{% url 'webapp:home' %}" class="nav-item {% if nav == 'home' %}active{% endif %}">
      <i data-lucide="book-open-check"></i><span>Testlar</span>
    </a>
    <a href="{% url 'webapp:dtm' %}" class="nav-item {% if nav == 'dtm' %}active{% endif %}">
      <i data-lucide="graduation-cap"></i><span>DTM</span>
    </a>
    <a href="{% url 'webapp:create_option' %}" class="nav-item {% if nav == 'create' %}active{% endif %}">
      <i data-lucide="circle-plus"></i><span>Yaratish</span>
    </a>
    <a href="{% url 'webapp:send_test' %}" class="nav-item {% if nav == 'send' %}active{% endif %}">
      <i data-lucide="send"></i><span>Yuborish</span>
    </a>
    <a href="{% if request.tg_user %}{% url 'webapp:profile' %}{% else %}{% url 'webapp:register' %}{% endif %}" class="nav-item {% if nav == 'profile' %}active{% endif %}">
      {% if request.tg.photo_url %}<img src="{{ request.tg.photo_url }}" alt="" class="nav-avatar">{% else %}<i data-lucide="circle-user-round"></i>{% endif %}
      <span>Profil</span>
    </a>
  </div>
</nav>
